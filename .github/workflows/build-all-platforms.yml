name: Build all platforms

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  quality:
    name: Quality gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: embedded_gateway/requirements-build.txt
      - run: flutter pub get
      - name: JavaScript syntax and proxy tests
        shell: pwsh
        run: |
          python -m compileall -q embedded_gateway/launcher.py embedded_gateway/vendor/chatgpt2api/api embedded_gateway/vendor/chatgpt2api/services embedded_gateway/vendor/chatgpt2api/utils
          node --check app.js
          node --check image-task-stability.js
          node --check codex-image-gateway.js
          node --check api-proxy.js
          node --check qa/regression-runner.js
          node --check qa/static-audit.js
          node qa/static-audit.js
          node --test qa/api-proxy.test.js
          node --test qa/image-task-stability.test.js
          node qa/codex-image-gateway-adapter.test.js
      - name: Browser regression suite
        run: node qa/regression-runner.js
      - run: flutter analyze
      - run: flutter test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          cache: true
      - name: Restore release signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "Android release signing secrets are required; refusing to publish a debug-signed release artifact."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-keystore.jks
          : > android/key.properties
          echo "storePassword=$STORE_PASSWORD" >> android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties
          echo "storeFile=release-keystore.jks" >> android/key.properties
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Generate checksum
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha256
          if-no-files-found: error

  windows:
    name: Windows Installer
    runs-on: windows-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: embedded_gateway/requirements-build.txt
      - run: flutter config --enable-windows-desktop
      - run: flutter pub get
      - name: Generate Windows Flutter config
        shell: pwsh
        run: |
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Flutter 3.24 can fail here by selecting an unavailable Visual Studio generator. Continuing after generating Flutter config."
            $global:LASTEXITCODE = 0
          }
          if (-not (Test-Path "windows/flutter/ephemeral/generated_config.cmake")) {
            throw "Flutter did not generate windows/flutter/ephemeral/generated_config.cmake."
          }
          if (Test-Path "build/windows/x64") {
            Remove-Item "build/windows/x64" -Recurse -Force
          }
      - name: Build Windows app with installed Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $version = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationVersion
          if (-not $version) {
            throw "Visual Studio was not found on this runner."
          }

          if ($version.StartsWith("18.")) {
            $generator = "Visual Studio 18 2026"
          } elseif ($version.StartsWith("17.")) {
            $generator = "Visual Studio 17 2022"
          } else {
            throw "Unsupported Visual Studio version: $version"
          }

          cmake -S windows -B build/windows/x64 -G "$generator" -A x64 -DFLUTTER_TARGET_PLATFORM=windows-x64
          cmake --build build/windows/x64 --config Release --target INSTALL
      - name: Build and bundle the image-only ChatGPT gateway
        shell: pwsh
        run: |
          $dist = Join-Path $env:RUNNER_TEMP "langbai-gateway-dist"
          .\embedded_gateway\build-windows.ps1 -Python "python" -OutputDirectory $dist
          $source = Join-Path $dist "langbai_chatgpt_gateway"
          $target = "build/windows/x64/runner/Release/chatgpt_gateway"
          if (-not (Test-Path (Join-Path $source "langbai_chatgpt_gateway.exe"))) {
            throw "The embedded ChatGPT image gateway executable is missing."
          }
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          Copy-Item (Join-Path $source "*") $target -Recurse -Force
          if (-not (Test-Path (Join-Path $target "langbai_chatgpt_gateway.exe"))) {
            throw "The embedded ChatGPT image gateway was not copied into the Windows release."
          }
          .\embedded_gateway\smoke-packaged.ps1 -Executable (Join-Path $target "langbai_chatgpt_gateway.exe")
          $env:LANGBAI_EMBEDDED_GATEWAY_EXECUTABLE = (Resolve-Path (Join-Path $target "langbai_chatgpt_gateway.exe")).Path
          flutter test test/embedded_gateway_process_test.dart
      - name: Verify packaged frontend assets
        shell: pwsh
        run: |
          $assets = "build/windows/x64/runner/Release/data/flutter_assets"
          foreach ($name in @("index.html", "bootstrap-guard.js", "image-task-stability.js", "codex-image-gateway.js", "app.js", "style.css")) {
            $path = Join-Path $assets $name
            if (-not (Test-Path $path) -or (Get-Item $path).Length -le 0) {
              throw "Missing or empty packaged frontend asset: $name"
            }
          }
          if (-not (Select-String -Path (Join-Path $assets "app.js") -Pattern 'const APP_VERSION = "1.5.0";' -Quiet)) {
            throw "Packaged app.js is not v1.5.0."
          }
          if (-not (Select-String -Path (Join-Path $assets "index.html") -Pattern 'bootstrap-guard.js\?v=20260729-1-5-0' -Quiet)) {
            throw "Packaged index.html does not reference the v1.5.0 bootstrap guard."
          }
      - name: Run hidden Windows WebView2 startup smoke test
        shell: pwsh
        run: |
          $exe = Resolve-Path "build/windows/x64/runner/Release/ai_image_generator.exe"
          $process = Start-Process -FilePath $exe -ArgumentList "--windows-webview-self-test" -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) {
            Stop-Process -Id $process.Id -Force
            throw "Windows WebView2 startup smoke test timed out."
          }
          if ($process.ExitCode -ne 0) {
            throw "Windows WebView2 startup smoke test failed with exit code $($process.ExitCode)."
          }
      - name: Verify Windows hit testing reaches WebView2
        shell: pwsh
        run: |
          Add-Type @'
          using System;
          using System.Runtime.InteropServices;
          using System.Text;
          public static class NativeHitTest {
            [StructLayout(LayoutKind.Sequential)] public struct POINT { public int X; public int Y; }
            [DllImport("user32.dll")] public static extern bool ClientToScreen(IntPtr hWnd, ref POINT point);
            [DllImport("user32.dll")] public static extern IntPtr WindowFromPoint(POINT point);
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern int GetClassName(IntPtr hWnd, StringBuilder name, int maxCount);
            [DllImport("user32.dll")] public static extern bool ShowWindow(IntPtr hWnd, int command);
          }
          '@
          $exe = Resolve-Path "build/windows/x64/runner/Release/ai_image_generator.exe"
          $readyFile = Join-Path $env:TEMP "langbai_webview_input_ready.flag"
          Remove-Item $readyFile -Force -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath $exe -ArgumentList "--windows-webview-input-self-test" -PassThru
          $readyDeadline = [DateTime]::UtcNow.AddSeconds(20)
          while ([DateTime]::UtcNow -lt $readyDeadline -and -not $process.HasExited -and -not (Test-Path $readyFile)) {
            Start-Sleep -Milliseconds 250
          }
          if (-not (Test-Path $readyFile)) {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
            throw "WebView2 hit-test page never became ready."
          }
          $process.Refresh()
          [NativeHitTest]::ShowWindow($process.MainWindowHandle, 9) | Out-Null
          Start-Sleep -Milliseconds 500
          $point = New-Object NativeHitTest+POINT
          $point.X = 64
          $point.Y = 40
          if (-not [NativeHitTest]::ClientToScreen($process.MainWindowHandle, [ref]$point)) {
            Stop-Process -Id $process.Id -Force
            throw "Could not convert the WebView test point to screen coordinates."
          }
          $hitWindow = [NativeHitTest]::WindowFromPoint($point)
          $className = New-Object System.Text.StringBuilder 256
          [NativeHitTest]::GetClassName($hitWindow, $className, $className.Capacity) | Out-Null
          Write-Host "WindowFromPoint: hwnd=$hitWindow class=$className screen=$($point.X),$($point.Y)"
          Stop-Process -Id $process.Id -Force
          if ($className.ToString() -ne "Chrome_RenderWidgetHostHWND") {
            throw "Windows hit testing reached '$className' instead of Chromium."
          }
      - name: Package Windows app
        shell: pwsh
        run: |
          Copy-Item windows/README-Windows.md build/windows/x64/runner/Release/README-Windows.md -Force
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: |
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value.Split('+')[0]
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "windows\installer\setup.iss" "/DMyAppVersion=$version"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compile failed with exit code $LASTEXITCODE" }
          Copy-Item "windows\installer\Output\AI-Image-Generator-Setup.exe" "AI-Image-Generator-Setup.exe"
          (Get-FileHash "AI-Image-Generator-Setup.exe" -Algorithm SHA256).Hash.ToLower() + "  AI-Image-Generator-Setup.exe" | Set-Content "AI-Image-Generator-Setup.exe.sha256" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            AI-Image-Generator-Setup.exe
            AI-Image-Generator-Setup.exe.sha256
          if-no-files-found: error

  macos:
    name: macOS app
    runs-on: macos-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          cache: true
      - run: flutter config --enable-macos-desktop
      - run: flutter pub get
      - run: flutter build macos --release
      - name: Package macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/AI Image Generator.app" AI-Image-Generator-macos.zip
          shasum -a 256 AI-Image-Generator-macos.zip > AI-Image-Generator-macos.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            AI-Image-Generator-macos.zip
            AI-Image-Generator-macos.zip.sha256
          if-no-files-found: error

  ios:
    name: iOS app unsigned
    runs-on: macos-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned iOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app AI-Image-Generator-ios-unsigned.zip
          shasum -a 256 AI-Image-Generator-ios-unsigned.zip > AI-Image-Generator-ios-unsigned.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release-unsigned
          path: |
            AI-Image-Generator-ios-unsigned.zip
            AI-Image-Generator-ios-unsigned.zip.sha256
          if-no-files-found: error
